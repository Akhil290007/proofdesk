[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofdesk"
version = "0.1.0"
description = "A claim-to-proof register for creators who fact-check viral claims before they publish."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Akhil Yadav" }]
keywords = ["fact-checking", "research", "creators", "claims", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Topic :: Text Processing",
]

[project.scripts]
proofdesk = "proofdesk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
